# Builds the Mac app on every pull request, and on every merge to main publishes it as a
# GitHub release that the installed apps update themselves to.
name: App de Mac

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-14
          - name: Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract y herramientas
        run: brew install tesseract dylibbundler
      - name: Dependencias
        run: pip install -r requirements.txt -r packaging/requirements-build.txt pytest
      - name: Pruebas
        run: python -m pytest -q
      - name: Armar la app
        run: packaging/build_mac.sh
        env:
          APP_REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.arch }}
          path: |
            dist/*.dmg
            dist/*.app.zip
          if-no-files-found: error

  release:
    name: Publicar versión
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$APP_VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Contactos D-Industrimex $APP_VERSION" --generate-notes
