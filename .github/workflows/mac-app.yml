# Pull requests run the tests on Linux. Every merge to main builds the Mac app and publishes it
# as a GitHub release that the installed apps update themselves to. macOS minutes count 10x
# against the free plan, so the app is only built on merges (or by hand from the Actions tab).
# Without minutes left, packaging/release_local.sh does the same from a Mac.
name: App de Mac

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Pruebas
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
      - name: Dependencias
        run: pip install -r requirements.txt pytest
      - name: Pruebas
        run: python -m pytest -q

  version:
    name: Versión
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.next.outputs.number }}
    steps:
      - id: next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The newest release plus one, so versions made with release_local.sh keep counting up.
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || echo v1.0.0)
          echo "number=1.0.$(( ${latest##*.} + 1 ))" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            runner: macos-14
          - name: Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      APP_VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tesseract y herramientas
        run: brew install tesseract dylibbundler
      - name: Dependencias
        run: pip install -r requirements.txt -r packaging/requirements-build.txt pytest
      - name: Pruebas
        run: python -m pytest -q
      - name: Armar la app
        run: packaging/build_mac.sh
        env:
          APP_REPO: ${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.arch }}
          path: |
            dist/*.dmg
            dist/*.app.zip
          if-no-files-found: error

  release:
    name: Publicar versión
    needs: [version, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      APP_VERSION: ${{ needs.version.outputs.number }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Crear release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$APP_VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Contactos D-Industrimex $APP_VERSION" --generate-notes
